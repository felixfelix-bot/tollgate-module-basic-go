name: Releak scan

# Nostr CI (ngit-ci) workflow. See .ngit/README.md for the authorization
# policy, how to read results, and what is deliberately not run here.
#
# ngit-ci reads `.ngit/act/workflows/` only — a file added under
# `.github/workflows/` is detected but never executed on the Nostr engine, so
# this lane exists in both places: `.github/workflows/releak-scan.yml` for
# GitHub Actions and this file for ngit-ci. Both invoke the same script
# (`scripts/security/releak_scan.py`), so a green run means the same thing on
# either engine and there is no second implementation to keep in sync.
#
# What it checks: the tree as checked out contains no leaked Nostr secret-key
# material — no `nsec1…` bech32 secret and no 64-hex key assigned to a
# `nostr.nsec` / `secret_key` / `private_key` name. It is deliberately
# self-contained: Python 3 standard library only, no network, no subprocess, no
# secrets consumed. Findings are reported as path:line + detector + SHA-256
# fingerprint; the material itself is never echoed into the job log, because a
# gate that prints the key has leaked it again.
#
# `act` gives the job no `.git` directory, so the scan walks the tree on disk
# (os.walk) instead of enumerating tracked files with `git ls-files`. That is
# the point of the "no .git needed" note below: it keeps this lane runnable
# verbatim by scripts/run-workflow-locally.py, outside CI.
#
# The `ci/**` branch filter is intentional: a branch that changes this workflow
# or the scanner must be able to run the lane before it lands on main.
# `workflow_dispatch` is the manual replay path (ngit 9840 trigger).

on:
  push:
    branches: [main, master, develop, "ci/**"]
  pull_request:
  workflow_dispatch:

jobs:
  releak-scan:
    runs-on: ubuntu-latest
    # The scan is a few hundred milliseconds over this tree; the cap only
    # bounds a pathological case. 30 is the coordinator's default job timeout.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      # Keep the checkout clean; the .git-less job volume appreciates it.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Report the toolchain
        run: python3 --version
      - name: Detector self-test (negative control)
        # Proves the detector fires inside the job: one planted leak per
        # detector must be found and the near-miss samples must stay clean.
        run: python3 scripts/security/releak_scan.py --self-test
      - name: Scan the tree for leaked key material
        # The allowlist waives four reviewed test fixtures by fingerprint
        # (see .ngit/releak-allowlist.txt); anything else fails the lane.
        run: >-
          python3 scripts/security/releak_scan.py
          --root "${GITHUB_WORKSPACE:-.}"
          --allowlist .ngit/releak-allowlist.txt
