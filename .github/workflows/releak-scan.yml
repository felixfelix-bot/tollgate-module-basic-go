name: Releak scan

# GitHub Actions twin of `.ngit/act/workflows/releak-scan.yml` (Nostr CI).
# Both engines invoke the same script — `scripts/security/releak_scan.py` — so
# a green run means the same thing on either side and there is no second
# implementation to keep in sync. ngit-ci reads `.ngit/act/workflows/` only,
# so without that twin file this lane would run on Nostr and nowhere else.
#
# Fails when the checked-out tree contains leaked Nostr secret-key material:
# an `nsec1…` bech32 secret or a 64-hex key assigned to a `nostr.nsec` /
# `secret_key` / `private_key` name. Findings are reported as path:line +
# detector + SHA-256 fingerprint; the material itself is never printed.
# `.ngit/releak-allowlist.txt` waives four reviewed *test fixtures* by
# fingerprint — editing the material revokes the waiver.

on:
  push:
    branches: [main, master, develop, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  releak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Report the toolchain
        run: python3 --version
      - name: Detector self-test (negative control)
        run: python3 scripts/security/releak_scan.py --self-test
      - name: Scan the tree for leaked key material
        run: >-
          python3 scripts/security/releak_scan.py
          --root "${GITHUB_WORKSPACE:-.}"
          --allowlist .ngit/releak-allowlist.txt
